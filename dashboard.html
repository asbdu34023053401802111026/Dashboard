
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDash admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">EduDash</a>

            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="dashboard.html" class="nav-link text-white">Dashboard</a>
                <button class="btn btn-light btn-sm" id="logoutBtn">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="welcome-box mb-4">
            <h2>Welcome, <p id="userName"></p> </h2>
            <p id="userEmail">Below Users Are Registered</p>
        </div>
        <div class="row g-4 mb-5">

            <div class="col-md-4">
                <div class="stat-card">
                    <i class="bi bi-book"></i>
                    <h3>4</h3>
                    <p>Total Users</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card">
                    <i class="bi bi-check-circle"></i>
                    <h3>4</h3>
                    <p>Activate Users</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card">
                    <i class="bi bi-clock-history"></i>
                    <h3>0</h3>
                    <p>deactive Users</p>
                </div>
            </div>

        </div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Registered Users</h3>

        <h5>Total Users: <span id="totalUsers">0</span></h5>
    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>S.No</th>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>


    <script src="dashboard.js"></script>
</body>
</html>

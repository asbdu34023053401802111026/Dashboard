
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eeedff, #dfe8ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-login {
            width: 100%;
            background: #6558d3;
            color: white;
        }

        .btn-login:hover {
            background: #5143bd;
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email"
                    class="form-control"
                    placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password"
                    class="form-control"
                    placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-login">
                Login
            </button>

            <p id="message" class="text-center mt-3"></p>

        </form>

    </div>
    

    <script src="login.js"></script>

</body>
</html>
